# Cloudflare Pages compatibility shell for Project Phoenix.
# Phase 1 keeps the original app contracts intact while Cloudflare preview is introduced.
name = "project-phoenix-ccn-daily"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
FIREBASE_PROJECT_ID = ""
PRODUCTION_ORIGIN = "https://theccndaily.com"
ADMIN_EMAIL = "pastor.eryeza@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "project_phoenix_ccn_daily"
database_id = "ade8eb7e-04e8-4c79-8501-13d8c568409d"

[dev]
port = 8788
