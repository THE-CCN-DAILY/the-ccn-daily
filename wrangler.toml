# Cloudflare Pages compatibility shell for Project Phoenix.
# Phase 1 keeps the original app contracts intact while Cloudflare preview is introduced.
name = "project-phoenix-ccn-daily"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
FIREBASE_PROJECT_ID = "ccn-daily"
PRODUCTION_ORIGIN = "https://theccndaily.com"
ADMIN_EMAIL = "pastor.eryeza@gmail.com"
# Flutterwave PUBLISHABLE public key — safe to commit (it ships in every client
# checkout). The SECRET key (FLWSECK) and webhook hash are wrangler secrets, never here.
# Returned by /api/payments/intent so the client uses one authoritative key.
FLUTTERWAVE_PUBLIC_KEY = "FLWPUBK-2d4211f1a8007f2f64cbdf9e26194a23-X"
# Cloudflare Stream (VOD + live) — REST API, no binding required.
#   CF_ACCOUNT_ID and CF_STREAM_TOKEN are SECRETS — set them via:
#     wrangler secret put CF_ACCOUNT_ID
#     wrangler secret put CF_STREAM_TOKEN      # API token scoped to Stream:Edit
#   CF_STREAM_CUSTOMER_SUBDOMAIN is NOT secret (it appears in every public playback URL).
#   Find it in the Stream dashboard (format: customer-<code>). Uncomment + set below:
# CF_STREAM_CUSTOMER_SUBDOMAIN = "customer-xxxxxxxx"

# R2 media bucket — serves uploaded covers/audio via /api/media/<key>
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "ccn-daily-media"

[[d1_databases]]
binding = "DB"
database_name = "project_phoenix_ccn_daily"
database_id = "ade8eb7e-04e8-4c79-8501-13d8c568409d"

# Workers AI — powers /api/ai/generate (devotional/prayer/study generation, tags).
# Was missing, so AI calls were silently falling back to stub text.
[ai]
binding = "AI"

[dev]
port = 8788
