<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bounce shareable bare paths into the HashRouter before the app boots. Lets links like
       theccndaily.com/join resolve to the in-app sign-up route even though this is a hash SPA. -->
  <script>
    (function () {
      var pathRoutes = { '/join': '/join' };
      var target = pathRoutes[location.pathname];
      if (target && !location.hash) {
        location.replace('/#' + target);
      }
    })();
  </script>

  <!-- Apply the saved theme before first paint to prevent a light-theme flash (FOUC) on the dark UI -->
  <script>
    (function () {
      try {
        document.documentElement.classList.add(localStorage.getItem('phoenix_theme') || 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <title>THE CCN DAILY — Your personal devotional space</title>
  <meta name="description" content="A quiet daily rhythm for Scripture, prayer, work, and spiritual steadiness. THE CCN DAILY helps busy professionals begin again with God every day." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="THE CCN DAILY" />
  <meta property="og:title" content="THE CCN DAILY — Your personal devotional space" />
  <meta property="og:description" content="Read, listen, reflect, journal, grow in community, and lead with a formed inner life. Start your daily spiritual rhythm today." />
  <meta property="og:url" content="https://theccndaily.com" />
  <meta property="og:image" content="https://theccndaily.com/logo-wordmark-white.webp" />
  <meta property="og:image:alt" content="THE CCN DAILY" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="THE CCN DAILY — Your personal devotional space" />
  <meta name="twitter:description" content="A quiet daily rhythm for Scripture, prayer, and spiritual steadiness." />
  <meta name="twitter:image" content="https://theccndaily.com/logo-wordmark-white.webp" />

  <!-- Structured data: Organization + WebSite (helps Google + AI engines parse the entity) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://theccndaily.com/#organization",
        "name": "THE CCN DAILY",
        "url": "https://theccndaily.com",
        "logo": "https://theccndaily.com/logo-wordmark-white.webp",
        "description": "A Christian daily-formation platform — devotionals, Bible, podcasts, audiobooks, courses, and community for busy professionals."
      },
      {
        "@type": "WebSite",
        "@id": "https://theccndaily.com/#website",
        "url": "https://theccndaily.com",
        "name": "THE CCN DAILY",
        "publisher": { "@id": "https://theccndaily.com/#organization" }
      }
    ]
  }
  </script>

  <!-- Theme color -->
  <meta name="theme-color" content="#0D0B09" />

  <!-- Canonical -->
  <link rel="canonical" href="https://theccndaily.com" />

  <!-- Favicon & PWA — brand flame icon. PNG is primary: the flame SVG is a
       heavy embedded raster that some browsers refuse to render as a favicon
       and fall back to a default globe. The 32px and 16px hints keep the tab
       icon crisp at small sizes. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" href="/flame-transparent.png" />
  <link rel="apple-touch-icon" href="/flame-transparent.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CCN Daily" />

  <link rel="stylesheet" href="/reader-theme.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
